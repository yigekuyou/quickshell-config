# Web 壁纸音频响应专用的 cava 配置（Services/AudioSpectrum.qml 起）。
#
# 与 settings/cava.conf（顶栏可视化用，用户可改）分开：
# 那边是给人看的字符柱，18 根、8 级量化、60fps；
# 这边要喂给 Wallpaper Engine 的 web API，形状是固定的：
#   * 64 个频段（WE 的 audioArray 是 128 个值 = 左 64 + 右 64，
#     我们只有单声道，Web.qml 把左声道复制成右声道）
#   * 30fps（WE 原生推送频率就约 30 次/秒）
#   * ASCII 输出 0..100，QML 侧 /100 归一到 0..1
[num]

[general]
bars = 64
framerate = 30

[input]
method = pipewire
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100

[smoothing]